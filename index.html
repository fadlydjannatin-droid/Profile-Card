<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card</title>
    <!-- Link ganti ikon tab browser -->
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <!-- Link CSS -->
    <link rel="stylesheet" href="style.css" />
    <!-- Link Font dan icon Awesome -->
    <link

      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <!-- Kartu Profil  -->
    <div class="card">
      <img
        src="https://api.dicebear.com/10.x/shadows/svg?seed=Felix"

      <div class="social-links">
        <a
          href="https://www.instagram.com/fadlydjannatin"
          target="_blank"
          rel="noopener noreferrer"
          ><i class="fab fa-instagram"></i
        ></a>
        <a
          href="https://www.linkedin.com/in/fadlydjannatin"
          target="_blank"
          rel="noopener noreferrer"
          ><i class="fab fa-linkedin"></i
        ></a>
        <a
          href="https://github.com/fadlydjannatin-droid"
          target="_blank"
          rel="noopener noreferrer"
          ><i class="fab fa-github"></i
        ></a>

    </div>

</html>
